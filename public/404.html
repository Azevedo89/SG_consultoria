<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | SG Consultoria e Assessoria</title>
    <link rel="icon" type="image/png" href="/assets/sg-favicon.png?v=2" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --text: #ffffff;
        --muted: #a7a7a7;
        --ink: #050505;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        color: var(--text);
        background: var(--bg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(100%, 560px);
        text-align: center;
      }

      img {
        display: block;
        width: 132px;
        max-width: 60%;
        margin: 0 auto 32px;
      }

      h1 {
        margin: 0 0 20px;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 500;
        line-height: 1.1;
        font-size: clamp(2.2rem, 9vw, 3.4rem);
      }

      p {
        margin: 0 0 12px;
        color: var(--muted);
      }

      p[lang="en"] {
        margin-bottom: 32px;
        font-size: 0.94rem;
      }

      a {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        color: var(--ink);
        background: var(--text);
        font-size: 0.86rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        box-shadow: 0 16px 36px rgba(255, 255, 255, 0.12);
        transition: background 220ms ease, box-shadow 220ms ease;
      }

      a:hover {
        background: #dcdcdc;
        box-shadow: 0 18px 44px rgba(255, 255, 255, 0.18);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/sg-logo.png" alt="SG Consultoria e Assessoria" />
      <h1>404</h1>
      <p lang="pt-PT">Página não encontrada. O endereço que procura não existe ou foi movido.</p>
      <p lang="en">Page not found. The address you are looking for does not exist or has moved.</p>
      <a href="/">Voltar ao início · Back to home</a>
    </main>
  </body>
</html>
